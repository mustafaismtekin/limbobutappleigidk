kind = "web"
previewPath = "/"
title = "Apples"
version = "1.0.0"
id = "artifacts/consumerthing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23765

[services.development]
run = "pnpm --filter @workspace/consumerthing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/consumerthing", "run", "build" ]
serve = "static"
publicDir = "artifacts/consumerthing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23765"
BASE_PATH = "/"
